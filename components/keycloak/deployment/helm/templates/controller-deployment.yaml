{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-identity-controller
  annotations:
    {{- include "xfsc.annotations" .Values.injection.controller | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ printf "%s-identity-controller" .Release.Name | quote }}}
  template:
    metadata:
      labels: {app: {{ printf "%s-identity-controller" .Release.Name | quote }}}
      annotations:
        {{- include "xfsc.annotations" .Values.injection.controller | nindent 8 }}
    spec:
      containers:
        - name: controller
          image: {{ printf "%s:%s" .Values.controller.image.repository .Values.controller.image.tag | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            {{- if not .Values.injection.controller.enabled }}
            - {name: NATS_URL, value: {{ .Values.nats.url | quote }}}
            {{- end }}
            - {name: KEYCLOAK_ADMIN_URL, value: {{ default (printf "http://%s-keycloak:8080" .Release.Name) .Values.controller.adminUrl | quote }}}
            - {name: KEYCLOAK_ADMIN_REALM, value: {{ .Values.controller.adminRealm | quote }}}
            - {name: KEYCLOAK_CLIENT_ID, value: {{ .Values.controller.clientId | quote }}}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "xfsc.clientSecret" . | quote }}
                  key: {{ .Values.controller.clientSecret.secretKey | quote }}
{{- end }}
