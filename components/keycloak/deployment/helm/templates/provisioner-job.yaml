{{- if .Values.keycloak.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-identity-provisioner
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: {{ .Values.keycloak.provisioning.timeoutSeconds }}
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provisioner
          image: {{ .Values.keycloak.provisioning.image | quote }}
          command: ["python", "/opt/provision/provision.py"]
          volumeMounts:
            - {name: script, mountPath: /opt/provision, readOnly: true}
          env:
            - {name: KEYCLOAK_URL, value: {{ printf "http://%s-keycloak:8080" .Release.Name | quote }}}
            - {name: CLIENT_ID, value: {{ .Values.controller.clientId | quote }}}
            - {name: ADMIN_ROLE, value: {{ .Values.keycloak.provisioning.role | quote }}}
            - {name: ADMIN_USERNAME, value: {{ .Values.keycloak.bootstrapAdmin.username | quote }}}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xfsc.adminSecret" . | quote }}
                  key: {{ .Values.keycloak.bootstrapAdmin.passwordSecretKey | quote }}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "xfsc.clientSecret" . | quote }}
                  key: {{ .Values.controller.clientSecret.secretKey | quote }}
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-identity-provisioner-script
{{- end }}
