{{- $secrets := list (dict "name" (include "xfsc.dbSecret" .) "key" .Values.keycloak.database.passwordSecretKey) (dict "name" (include "xfsc.adminSecret" .) "key" .Values.keycloak.bootstrapAdmin.passwordSecretKey) (dict "name" (include "xfsc.clientSecret" .) "key" .Values.controller.clientSecret.secretKey) -}}
{{- range $s := $secrets }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $s.name -}}
{{- if not $existing }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $s.key }}: {{ randAlphaNum 48 | b64enc | quote }}
{{- end }}
{{- end }}
