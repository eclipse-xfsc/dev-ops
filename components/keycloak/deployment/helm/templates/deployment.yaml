
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  annotations:
    {{- include "xfsc.annotations" .Values.injection.keycloak | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ printf "%s-keycloak" .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: {{ printf "%s-keycloak" .Release.Name | quote }}
      annotations:
        {{- include "xfsc.annotations" .Values.injection.keycloak | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - start
            {{- if .Values.keycloak.optimized }}
            - --optimized
            {{- end }}

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          env:
            # Public URL / Gateway TLS termination
            - name: KC_HOSTNAME
              value: {{ required "keycloak.hostname is required" .Values.keycloak.hostname | quote }}

            - name: KC_HTTP_ENABLED
              value: "true"

            - name: KC_PROXY_HEADERS
              value: "xforwarded"

            - name: KC_DB
              value: postgres

            # Bootstrap admin
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.bootstrapAdmin.username | quote }}

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xfsc.adminSecret" . | quote }}
                  key: {{ .Values.keycloak.bootstrapAdmin.passwordSecretKey | quote }}

            {{- if .Values.injection.keycloak.enabled }}

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-credentials
                  key: "username"

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-credentials
                  key: "password"

            {{- end }}


            {{- if not .Values.injection.keycloak.enabled }}
            # Original variables only without operator injection
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}

            - name: KC_DB_URL
              value: {{ .Values.keycloak.database.url | quote }}

            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.database.username | quote }}

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xfsc.dbSecret" . | quote }}
                  key: {{ .Values.keycloak.database.passwordSecretKey | quote }}

                        # Database type is required independently of injection
            - name: KC_DB
              value: "postgres"
            {{- end }}
