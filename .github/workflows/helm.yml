name: Deploy Helm Chart (Org Workflow)

on:
  workflow_call:
    inputs: 
       buildContext:
        description: 'path for build'
        type: string
        default: "helm"
        required: false
       harbor_config:
        description: 'path to harbor config'
        type: string
        default: "harbor.config"
        required: false
jobs:
  setup:
    uses: eclipse-xfsc/dev-ops/.github/workflows/build-context.yml@main
    secrets: inherit
  helm-push:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use IMAGE_TAG
        run: | 
          echo "The image tag is: ${{ needs.setup.outputs.image_tag }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Find and Push Helm Charts
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          HARBOR_CREDENTIALS: ${{ secrets.HARBOR_CREDENTIALS }}
        run: |
          set -euo pipefail
          git clone https://github.com/eclipse-xfsc/dev-ops.git devops
          chmod +x ./devops/scripts/harborconfig.sh
          . ./devops/scripts/harborconfig.sh ${{ inputs.harbor_config}}
      
          helm registry login "$HARBOR_HOST" \
            --username "$HARBOR_USERNAME" \
            --password "$HARBOR_PASSWORD"
      
          CHART_DIR="${{ inputs.buildContext }}"
          cd "$CHART_DIR"
      
          echo "Using chart version: ${{ needs.setup.outputs.image_tag }}"
      
          sed -i -E \
            "s|^version:[[:space:]]*.*$|version: ${{ needs.setup.outputs.image_tag }}|" \
            Chart.yaml
      
          echo "Updated Chart.yaml:"
          grep '^version:' Chart.yaml
      
          echo "Build Dependencies"
          helm dependency build
      
          echo "Build Chart"
          helm package .
          
          CHART_NAME="$(sed -nE 's/^name:[[:space:]]*["'\'']?([^"'\'']+)["'\'']?[[:space:]]*$/\1/p' Chart.yaml)"
          
          PACKAGE_FILES=("${CHART_NAME}"-*.tgz)
          
          if [[ ${#PACKAGE_FILES[@]} -ne 1 || ! -f "${PACKAGE_FILES[0]}" ]]; then
            echo "::error::Es wurde nicht genau ein Helm-Paket für '$CHART_NAME' gefunden."
            printf 'Gefundene Kandidaten: %s\n' "${PACKAGE_FILES[@]}"
            exit 1
          fi
          
          PACKAGE_FILE="${PACKAGE_FILES[0]}"
          
          echo "Push Chart: $PACKAGE_FILE"
          helm push "$PACKAGE_FILE" "oci://$HARBOR_HOST/$HARBOR_PROJECT"
