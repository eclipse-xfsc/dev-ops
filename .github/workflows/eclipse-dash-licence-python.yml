# .github/workflows/license-check.yml

name: License Check

on:
  workflow_call:
    inputs:
      requirements_path:
        description: 'Path to requirements.txt'
        required: true
        type: string

jobs:
  check-licenses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies dry-run and transform output
        run: |
          pip install --upgrade pip
          pip install -r ${{ inputs.requirements_path }} --dry-run \
          | grep -Po "(?<=^Would install ).*$" \
          | tr ' ' '\n' \
          | sed -E 's|^([^=<>[:space:]]+)-([0-9][^[:space:]]*)$|pypi/pypi/-/\1/\2/|' \
          > packages.txt

      - name: Download Eclipse Dash Licenses Tool
        run: |
          curl -sSL -o dash-licenses.jar \
            "https://repo.eclipse.org/service/local/artifact/maven/redirect?r=dash-licenses&g=org.eclipse.dash&a=org.eclipse.dash.licenses&v=LATEST"

      - name: Run License Tool
        env:
          TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
        run: |
          DASH_ARGS="-repo https://github.com/${{ github.repository }} -review -project technology.xfsc -token $TOKEN"
          java -Dorg.slf4j.simpleLogger.defaultLogLevel=debug -jar dash-licenses/org.eclipse.dash.licenses.jar $DASH_ARGS - < packages.txt
