on:
  workflow_call:
    inputs:
      repo_name: 
         description: "Final Repo name"
         type: string
         default: ''
         required: false
    outputs:
      image_tag:
        description: "Sanitized image tag"
        value: ${{ jobs.setup.outputs.image_tag }}
      repo_name:
        description: "Final Repo name"
        value: ${{ jobs.setup.outputs.repo_name}}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      repo_name: ${{ steps.set-repo-name.outputs.repo_name }}
    env:
      CI_DEFAULT_BRANCH: 'main'
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set IMAGE_TAG
        id: set-tag
        shell: bash
        run: |
          set -euo pipefail
      
          if [[ -z "${IMAGE_TAG:-}" ]]; then
      
            if [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]]; then
              IMAGE_TAG="latest"
      
            elif [[ -n "$CI_COMMIT_TAG" ]]; then
              NORMALIZED_TAG="${CI_COMMIT_TAG#v}"
      
              SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      
              if [[ "$NORMALIZED_TAG" =~ $SEMVER_REGEX ]]; then
                #
                # v1.2.3 -> 1.2.3
                # v1.2.3-rc.1 -> 1.2.3-rc.1
                #
                IMAGE_TAG="$NORMALIZED_TAG"
              else
                #
                # Nicht-SemVer-Tags in gültige SemVer-Build-Metadaten umwandeln
                # release/foo -> release.foo
                #
                TAG_METADATA="$(printf '%s' "$CI_COMMIT_TAG" \
                  | sed -E 's/[^0-9A-Za-z.-]+/./g; s/^[.-]+//; s/[.-]+$//')"
      
                if [[ -z "$TAG_METADATA" ]]; then
                  echo "::error::Git tag kann nicht in einen gültigen IMAGE_TAG umgewandelt werden."
                  exit 1
                fi
      
                IMAGE_TAG="0.0.0+${TAG_METADATA}"
              fi
      
            else
              #
              # Branch-Build
              #
              BRANCH="$(printf '%s' "$CI_COMMIT_REF_NAME" \
                | sed -E 's/[^0-9A-Za-z-]+/-/g; s/^-+//; s/-+$//')"
      
              IMAGE_TAG="branch-${BRANCH}"
            fi
          fi
      
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Set Repo Name
        id: set-repo-name
        run: |
          if [ -z "${{ inputs.repo_name }}" ]; then
            # Nutze den aktuellen GitHub Repo-Namen (nach dem Slash)
            IMAGE_REPO=$(basename "${GITHUB_REPOSITORY}")
          else
            IMAGE_REPO="${{ inputs.repo_name }}"
          fi
          
          echo "repo_name=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
           
