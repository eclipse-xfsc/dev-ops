on:
  workflow_call:
    inputs:
      repo_name:
        description: "Final repository name"
        type: string
        default: ""
        required: false

    outputs:
      image_tag:
        description: "Sanitized Docker image tag"
        value: ${{ jobs.setup.outputs.image_tag }}

      repo_name:
        description: "Final repository name"
        value: ${{ jobs.setup.outputs.repo_name }}

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      repo_name: ${{ steps.set-repo-name.outputs.repo_name }}

    env:
      CI_DEFAULT_BRANCH: main
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_REF_TYPE: ${{ github.ref_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        shell: bash
        run: |
          set -euo pipefail

          sanitize_identifier() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E '
                  s/[^0-9a-z.-]+/-/g;
                  s/^[.-]+//;
                  s/[.-]+$//;
                  s/[.-]{2,}/-/g
                '
          }

          if [[ -n "${IMAGE_TAG:-}" ]]; then
            FINAL_IMAGE_TAG="$(sanitize_identifier "$IMAGE_TAG")"

          elif [[ "$CI_COMMIT_REF_TYPE" == "tag" ]]; then
            NORMALIZED_TAG="${CI_COMMIT_REF_NAME#v}"

            SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

            if [[ "$NORMALIZED_TAG" =~ $SEMVER_REGEX ]]; then
              #
              # Docker-Tags unterstützen kein "+".
              #
              # v1.2.3           -> 1.2.3
              # v1.2.3-rc.1      -> 1.2.3-rc.1
              # v1.2.3+build.5   -> 1.2.3-build.5
              #
              FINAL_IMAGE_TAG="${NORMALIZED_TAG//+/-}"
            else
              #
              # release/foo -> 0.0.0-release-foo
              #
              TAG_IDENTIFIER="$(sanitize_identifier "$CI_COMMIT_REF_NAME")"

              if [[ -z "$TAG_IDENTIFIER" ]]; then
                echo "::error::Git tag cannot be converted into a valid Docker image tag."
                exit 1
              fi

              FINAL_IMAGE_TAG="0.0.0-${TAG_IDENTIFIER}"
            fi

          elif [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]]; then
            FINAL_IMAGE_TAG="latest"

          else
            #
            # Branch builds:
            #
            # dev              -> 0.0.0-dev
            # feature/foo      -> 0.0.0-feature-foo
            # renovate/go-1.x  -> 0.0.0-renovate-go-1.x
            #
            BRANCH_IDENTIFIER="$(sanitize_identifier "$CI_COMMIT_REF_NAME")"

            if [[ -z "$BRANCH_IDENTIFIER" ]]; then
              echo "::error::Branch name cannot be converted into a valid Docker image tag."
              exit 1
            fi

            FINAL_IMAGE_TAG="0.0.0-${BRANCH_IDENTIFIER}"
          fi

          if [[ -z "$FINAL_IMAGE_TAG" ]]; then
            echo "::error::IMAGE_TAG is empty."
            exit 1
          fi

          if (( ${#FINAL_IMAGE_TAG} > 128 )); then
            echo "::error::IMAGE_TAG exceeds the Docker limit of 128 characters."
            exit 1
          fi

          echo "IMAGE_TAG=${FINAL_IMAGE_TAG}"
          echo "image_tag=${FINAL_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set repository name
        id: set-repo-name
        shell: bash
        env:
          INPUT_REPO_NAME: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_REPO_NAME" ]]; then
            IMAGE_REPO="$INPUT_REPO_NAME"
          else
            IMAGE_REPO="${GITHUB_REPOSITORY##*/}"
          fi

          if [[ -z "$IMAGE_REPO" ]]; then
            echo "::error::Repository name is empty."
            exit 1
          fi

          echo "REPO_NAME=${IMAGE_REPO}"
          echo "repo_name=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
