name: Build Components

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  detect-folders:
    runs-on: ubuntu-latest
    outputs:
      docker-folders: ${{ steps.detect.outputs.docker-folders }}
      helm-folders: ${{ steps.detect.outputs.helm-folders }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker and Helm components
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          DOCKER_FOLDERS='[]'
          HELM_FOLDERS='[]'

          for COMPONENT in components/*/; do
            FOLDER="$(basename "$COMPONENT")"

            if [[ -f "${COMPONENT}deployment/docker/Dockerfile" ]]; then
              DOCKER_FOLDERS="$(
                jq -c --arg folder "$FOLDER" \
                  '. + [$folder]' <<< "$DOCKER_FOLDERS"
              )"
            fi

            if [[ -f "${COMPONENT}deployment/helm/Chart.yaml" ]]; then
              HELM_FOLDERS="$(
                jq -c --arg folder "$FOLDER" \
                  '. + [$folder]' <<< "$HELM_FOLDERS"
              )"
            fi
          done

          echo "Docker components: $DOCKER_FOLDERS"
          echo "Helm components:   $HELM_FOLDERS"

          echo "docker-folders=$DOCKER_FOLDERS" >> "$GITHUB_OUTPUT"
          echo "helm-folders=$HELM_FOLDERS" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: detect-folders
    if: ${{ needs.detect-folders.outputs.docker-folders != '[]' }}
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.detect-folders.outputs.docker-folders) }}
    name: Build Docker Image for ${{ matrix.folder }}
    uses: ./.github/workflows/dockerbuild.yml
    secrets: inherit
    with:
      dockerfile: components/${{ matrix.folder }}/deployment/docker/Dockerfile
      buildContext: components/${{ matrix.folder }}
      service: ${{ matrix.folder }}

  helm-build:
    needs: detect-folders
    if: ${{ needs.detect-folders.outputs.helm-folders != '[]' }}
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.detect-folders.outputs.helm-folders) }}
    name: Build Helm Chart for ${{ matrix.folder }}
    uses: ./.github/workflows/helm.yml
    secrets: inherit
    with:
      buildContext: components/${{ matrix.folder }}/deployment/helm